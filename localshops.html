<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bwire Aesthetic Shop - Local Partners</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <style>
        /* Custom styles and component definitions */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        /* A custom blue color theme */
        .bg-brand-blue { background-color: #3b82f6; }
        .text-brand-blue { color: #3b82f6; }
        .border-brand-blue { border-color: #3b82f6; }
        .ring-brand-blue { --tw-ring-color: #3b82f6; }

        /* Smooth scrolling behavior */
        html { scroll-behavior: smooth; }

        /* Simple page transition animation */
        .page {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom scrollbar for a modern look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Ensure the active nav link is visually distinct */
        .nav-link.active {
            color: #3b82f6;
            font-weight: 600;
        }

        /* Cart panel transition */
        #cart-panel {
            transition: transform 0.3s ease-in-out;
        }

        /* Professional Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
        }
        .btn-danger {
            background-color: #dc2626;
            color: white;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
        }
        .btn-danger:hover {
            background-color: #b91c1c;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
            border-color: #94a3b8;
        }
        .dashboard-tab {
            padding: 0.5rem 1rem;
            font-weight: 500;
            color: #475569;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .dashboard-tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }
        .dashboard-tab:hover:not(.active) {
            background-color: #f1f5f9;
            border-bottom-color: #94a3b8;
        }
        #logoPreview {
            width: 96px; /* 6rem */
            height: 96px; /* 6rem */
            object-fit: cover;
            border-radius: 50%;
            border: 2px dashed #d1d5db; /* gray-300 */
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Main Application Container -->
    <div id="app" class="min-h-screen flex flex-col">

        <!-- Header and Navigation -->
        <header class="bg-white/90 backdrop-blur-lg shadow-sm sticky top-0 z-40">
            <nav class="container mx-auto px-6 lg:px-8">
                <div class="flex items-center justify-between h-20">
                    <!-- Logo -->
                    <a href="#" class="flex items-center space-x-3 nav-link" data-page="home">
                        <img src="BWIREEEEEEE.png" alt="Bwire Aesthetic Shop Logo" class="h-14 w-auto">
                        <span class="text-xl font-bold text-slate-900">Bwire Aesthetic Shop - Local</span>
                    </a>
                    
                    <!-- Desktop Navigation Links -->
                    <div class="hidden md:flex items-center space-x-10">
                        <a href="#" class="text-slate-600 hover:text-brand-blue transition-colors duration-300 nav-link" data-page="home">Home</a>
                        <a href="#" class="text-slate-600 hover:text-brand-blue transition-colors duration-300 nav-link" data-page="shop">Shop</a>
                        <a href="#" class="text-slate-600 hover:text-brand-blue transition-colors duration-300 nav-link" data-page="partners">Local Partners</a>
                        <a href="#" class="text-slate-600 hover:text-brand-blue transition-colors duration-300 nav-link" data-page="partner-form">Partner With Us</a>
                    </div>

                    <!-- Right side icons -->
                    <div class="flex items-center space-x-4">
                        <button id="cart-button" class="relative text-slate-600 hover:text-brand-blue">
                            <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c.51 0 .962-.343 1.087-.835l1.821-6.831a1.5 1.5 0 0 0-1.087-1.835H4.834M7.5 14.25L5.106 5.165A1.5 1.5 0 0 0 3.622 4H2.25m5.25 10.5a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
                            </svg>
                            <span id="cart-count" class="absolute -top-1 -right-2 bg-brand-blue text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
                        </button>
                        <!-- Partner Login/Dashboard Button -->
                        <div id="partner-auth-area">
                             <button class="nav-link btn btn-primary text-sm" data-page="partner-login">Partner Login</button>
                        </div>
                        <!-- Mobile Menu Button -->
                        <button id="mobile-menu-button" class="md:hidden text-slate-600 hover:text-brand-blue">
                            <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                            </svg>
                        </button>
                    </div>
                </div>
                 <!-- Mobile Menu (collapsible) -->
                <div id="mobile-menu" class="hidden md:hidden py-4 space-y-2">
                    <a href="#" class="block py-2 px-4 text-sm hover:bg-slate-100 rounded-md nav-link" data-page="home">Home</a>
                    <a href="#" class="block py-2 px-4 text-sm hover:bg-slate-100 rounded-md nav-link" data-page="shop">Shop</a>
                    <a href="#" class="block py-2 px-4 text-sm hover:bg-slate-100 rounded-md nav-link" data-page="partners">Local Partners</a>
                    <a href="#" class="block py-2 px-4 text-sm hover:bg-slate-100 rounded-md nav-link" data-page="partner-form">Partner With Us</a>
                </div>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow container mx-auto px-6 lg:px-8 py-10">
            
            <!-- All page content goes here -->
            <div id="page-container">
                <!-- Page content will be injected by JS -->
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-slate-900 text-white mt-12">
            <div class="container mx-auto px-6 lg:px-8 py-8 text-center text-slate-400">
                <p>&copy; 2025 Bwire Aesthetic Shop. All Rights Reserved.</p>
            </div>
        </footer>

    </div>

    <!-- All Modals -->
    <div id="modal-container">
        <!-- Product Details Modal -->
        <div id="product-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
            <div id="product-modal-content" class="bg-white rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col md:flex-row transform scale-95 opacity-0 transition-all duration-300"></div>
        </div>
        <!-- Cart Modal / Off-canvas Panel -->
        <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50">
            <div id="cart-panel" class="absolute right-0 top-0 w-full max-w-md bg-white h-full shadow-2xl flex flex-col transform translate-x-full"></div>
        </div>
        <!-- First-time Password Change Modal -->
        <div id="password-change-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
                <form id="password-change-form">
                    <h2 class="text-2xl font-bold mb-2">Create New Password</h2>
                    <p class="text-slate-600 mb-6 text-sm">For security, please create a new password for your partner account.</p>
                    <div class="mb-4">
                        <label for="newPassword" class="block text-sm font-medium text-slate-700">New Password</label>
                        <input type="password" id="newPassword" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue">
                    </div>
                     <div class="mb-6">
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm New Password</label>
                        <input type="password" id="confirmPassword" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue">
                    </div>
                    <button type="submit" class="w-full btn btn-primary">Set New Password</button>
                </form>
            </div>
        </div>
        <!-- Partner Add Product Modal -->
        <div id="add-product-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-2xl p-8 max-w-lg w-full max-h-[90vh] overflow-y-auto">
                 <form id="add-product-form">
                    <h2 class="text-2xl font-bold mb-6">Add New Product</h2>
                    <div class="space-y-4">
                        <div>
                            <label for="productName" class="block text-sm font-medium text-slate-700">Product Name</label>
                            <input type="text" name="productName" id="productName" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="productCategory" class="block text-sm font-medium text-slate-700">Category</label>
                                <input type="text" name="productCategory" id="productCategory" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm">
                            </div>
                            <div>
                                <label for="productPrice" class="block text-sm font-medium text-slate-700">Price (Ksh)</label>
                                <input type="number" name="productPrice" id="productPrice" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm">
                            </div>
                        </div>
                        <div>
                            <label for="productImageUpload" class="block text-sm font-medium text-slate-700">Product Image</label>
                            <input type="file" id="productImageUpload" required accept="image/*" class="mt-1 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-brand-blue hover:file:bg-blue-100">
                            <input type="hidden" name="productImageUrl" id="productImageUrl">
                            <div id="product-upload-status" class="text-xs text-slate-500 mt-2"></div>
                        </div>
                        <div>
                            <label for="productDescription" class="block text-sm font-medium text-slate-700">Description</label>
                            <textarea name="productDescription" id="productDescription" rows="3" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm"></textarea>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="isSponsored" name="isSponsored" class="h-4 w-4 rounded border-gray-300 text-brand-blue focus:ring-brand-blue">
                            <label for="isSponsored" class="ml-2 block text-sm text-gray-900">Mark as a sponsored product</label>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end space-x-3">
                        <button type="button" id="close-add-product-modal-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Product</button>
                    </div>
                 </form>
            </div>
        </div>
    </div>


    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-slate-900 text-white py-2 px-5 rounded-lg shadow-lg hidden transform transition-all duration-300 z-50">
        <p id="toast-message"></p>
    </div>


    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // =================================================================================
        // FIREBASE CONFIG & INITIALIZATION
        // =================================================================================
       const firebaseConfig = {
      apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
      authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
      projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
      storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
      messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
      appId: import.meta.env.VITE_FIREBASE_APP_ID,
      measurementId: import.meta.env.VITE_FIREBASE_MEASUREMENT_ID
    };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // =================================================================================
        // APPLICATION STATE & DOM ELEMENTS
        // =================================================================================
        const state = { 
            currentPage: 'home',
            cart: [],
            allProducts: [],
            allPartners: [],
            isUploading: false,
            loggedInPartner: null,
            dashboardView: 'products'
        };
        
        const pageContainer = document.getElementById('page-container');
        const productModal = document.getElementById('product-modal');
        const productModalContent = document.getElementById('product-modal-content');
        const cartModal = document.getElementById('cart-modal');
        const cartPanel = document.getElementById('cart-panel');
        const passwordChangeModal = document.getElementById('password-change-modal');
        const addProductModal = document.getElementById('add-product-modal');

        // =================================================================================
        // PAGE TEMPLATES (HTML literals for dynamic content)
        // =================================================================================
        const pageTemplates = {
            home: `
                <div id="home-page" class="page">
                    <section class="text-center py-16 md:py-24">
                        <h1 class="text-4xl md:text-6xl font-bold text-slate-900 mb-4">Your Local Tech Marketplace</h1>
                        <p class="text-lg md:text-xl text-slate-600 mb-8 max-w-3xl mx-auto">Discover the best electronics from us and our trusted local partners across Kenya.</p>
                        <a href="#" class="btn btn-primary nav-link" data-page="shop">Start Shopping</a>
                    </section>
                    <section id="homepage-banner-ad" class="mb-12"></section>
                    <section class="py-12">
                        <h2 class="text-3xl font-bold text-center mb-10">Meet Our Approved Partners</h2>
                        <div id="featured-partners" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
                    </section>
                </div>`,
            shop: `
                <div id="shop-page" class="page">
                    <h1 class="text-4xl font-bold mb-8">Partner Products</h1>
                    <div id="category-sponsor-banner" class="mb-8"></div>
                    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
                </div>`,
            partners: `
                <div id="partners-page" class="page">
                    <h1 class="text-4xl font-bold mb-2">Approved Partners Directory</h1>
                    <p class="text-slate-600 mb-8">Support local businesses. Find trusted electronics shops near you.</p>
                    <div id="partner-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
                </div>`,
            'partner-form': `
                <div id="partner-form-page" class="page">
                    <div class="max-w-3xl mx-auto">
                        <h1 class="text-4xl font-bold mb-2 text-center">Partner With Us</h1>
                        <p class="text-slate-600 mb-8 text-center">Want to feature your shop on Bwire Aesthetic Shop? Fill out the form below to apply.</p>
                        <div id="application-container" class="bg-white p-8 rounded-lg shadow-md">
                            <form id="partner-application-form">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="md:col-span-2"><label for="shopName" class="block text-sm font-medium text-slate-700">Shop Name</label><input type="text" name="shopName" id="shopName" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue"></div>
                                    <div><label for="contactEmail" class="block text-sm font-medium text-slate-700">Contact Email</label><input type="email" name="contactEmail" id="contactEmail" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue"></div>
                                    <div><label for="contactPhone" class="block text-sm font-medium text-slate-700">Phone Number</label><input type="tel" name="contactPhone" id="contactPhone" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue"></div>
                                    <div class="md:col-span-2"><label for="location" class="block text-sm font-medium text-slate-700">Physical Location</label><input type="text" name="location" id="location" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue"></div>
                                    <div class="md:col-span-2"><label for="websiteUrl" class="block text-sm font-medium text-slate-700">Website or Social Media Link (Optional)</label><input type="url" name="websiteUrl" id="websiteUrl" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue"></div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-slate-700">Shop Logo</label>
                                        <div class="mt-2 flex items-center space-x-6">
                                            <img id="logoPreview" src="https://placehold.co/96x96/e2e8f0/94a3b8?text=Logo" alt="Logo preview">
                                            <label for="logoUpload" class="cursor-pointer bg-white py-2 px-3 border border-gray-300 rounded-md shadow-sm text-sm leading-4 font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                                <span>Upload a file</span>
                                                <input type="file" id="logoUpload" required accept="image/*" class="sr-only">
                                            </label>
                                        </div>
                                        <input type="hidden" name="logoUrl" id="logoUrl">
                                        <div id="upload-status" class="text-xs text-slate-500 mt-2"></div>
                                    </div>
                                    <div class="md:col-span-2"><label for="description" class="block text-sm font-medium text-slate-700">Short Description</label><textarea name="description" id="description" rows="4" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue"></textarea></div>
                                </div>
                                <div class="mt-6"><button type="submit" class="w-full btn btn-primary">Submit Application</button></div>
                            </form>
                            <div id="form-success-message" class="hidden text-center py-10">
                                <svg class="w-16 h-16 mx-auto text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <h2 class="text-2xl font-bold mb-2">Application Submitted!</h2>
                                <p class="text-slate-600">Thank you. We will review your application and contact you within 3-5 business days.</p>
                            </div>
                        </div>
                    </div>
                </div>`,
            'partner-shop': `<div id="partner-shop-page" class="page"></div>`,
            'partner-login': `
                <div id="partner-login-page" class="page">
                    <div class="max-w-md mx-auto">
                        <h1 class="text-3xl font-bold text-center mb-6">Partner Login</h1>
                        <div class="bg-white p-8 rounded-lg shadow-md">
                             <div id="login-error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"></div>
                            <form id="partner-login-form">
                                <div class="mb-4">
                                    <label for="loginEmail" class="block text-sm font-medium text-slate-700">Shop Email</label>
                                    <input type="email" id="loginEmail" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue" placeholder="your@email.com">
                                </div>
                                <div class="mb-6">
                                    <label for="loginPassword" class="block text-sm font-medium text-slate-700">Password</label>
                                    <input type="password" id="loginPassword" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue" placeholder="Enter your password">
                                </div>
                                <button type="submit" class="w-full btn btn-primary">Log In</button>
                                <p class="text-center text-sm text-gray-600 mt-4">
                                    <a href="#" id="forgot-password-link" class="text-brand-blue hover:underline">Forgot password?</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>`,
            'partner-forgot-password': `
                <div id="partner-forgot-password-page" class="page">
                    <div class="max-w-md mx-auto">
                        <h1 class="text-3xl font-bold text-center mb-6">Reset Password</h1>
                        <div class="bg-white p-8 rounded-lg shadow-md">
                            <form id="partner-forgot-password-form">
                                <p class="text-center text-sm text-slate-600 mb-4">Enter your email and we'll send a recovery link to your inbox.</p>
                                <div class="mb-4">
                                    <label for="reset-partner-email" class="block text-sm font-medium text-slate-700">Shop Email</label>
                                    <input type="email" id="reset-partner-email" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-brand-blue focus:ring-brand-blue">
                                </div>
                                <button type="submit" class="w-full btn btn-primary">Send Reset Link</button>
                                <p class="text-center text-sm text-slate-600 mt-4">
                                    Remembered it? <a href="#" id="back-to-login-link" class="text-brand-blue font-semibold hover:underline">Back to Login</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>`,
            'partner-dashboard': `<div id="partner-dashboard-page" class="page"></div>`
        };


        // =================================================================================
        // HELPER & RENDER FUNCTIONS
        // =================================================================================
        const showToast = (message, isError = false) => {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.querySelector('#toast-message').textContent = message;
            toast.classList.toggle('bg-red-600', isError);
            toast.classList.toggle('bg-slate-900', !isError);
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        };

        async function uploadToImgBB(file) {
            const apiKey = 'f8a2bc94b6bdb00a3bd4c1318367ae9e';
            const formData = new FormData();
            formData.append('image', file);
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, { method: 'POST', body: formData });

                if (result.success) return result.data.url;
                else throw new Error(result.error.message);

                return null;
            }
        }

        function addToCart(productId) {
            const product = state.allProducts.find(p => p.id === productId);
            if (!product) return;
            const existingItem = state.cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                state.cart.push({ ...product, quantity: 1 });
            }
            showToast(`${product.name} added to cart.`);
            updateCartUI();
        }

        function updateCartItemQuantity(productId, newQuantity) {
             const item = state.cart.find(item => item.id === productId);
             if (item) {

                     removeFromCart(productId);
                 } else {
                     item.quantity = newQuantity;
                 }
             }
             updateCartUI();
        }

            state.cart = state.cart.filter(item => item.id !== productId);

        async function handlePartnerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('login-error-message');
            errorDiv.classList.add('hidden');

            try {
                // Check if it's a temp password user first
                const partnerQuery = await db.collection('advertisers').where('email', '==', email).limit(1).get();
                if (!partnerQuery.empty) {
                    const partnerData = partnerQuery.docs[0].data();
                    if (partnerData.status === 'approved' && partnerData.requiresPasswordChange === true) {
                        state.loggedInPartner = { id: partnerQuery.docs[0].id, ...partnerData };
                        passwordChangeModal.classList.remove('hidden');
                        return;
                    }
                }

                const userCredential = await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                errorDiv.textContent = 'Invalid credentials. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        }

        // NEW: Handle password reset for partners
        async function handlePartnerPasswordReset(event) {
            event.preventDefault();
            const email = document.getElementById('reset-partner-email').value;
            try {
                await auth.sendPasswordResetEmail(email);
                showToast('Password reset link sent to your email!');
                showPage('partner-login');
            } catch (error) {
                showToast(`Error: ${error.message}`, true);
            }
        }
        
        async function handlePasswordChange(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword.length < 6) { showToast('Password must be at least 6 characters.', true); return; }
            if (newPassword !== confirmPassword) { showToast('Passwords do not match.', true); return; }
            
            try {
                let user;
                if (auth.currentUser) {
                     await auth.currentUser.updatePassword(newPassword);
                     user = auth.currentUser;
                } else {
                    const userCredential = await auth.signInWithEmailAndPassword(state.loggedInPartner.email, state.loggedInPartner.tempPassword);
                    user = userCredential.user;
                    await user.updatePassword(newPassword);
                }

                await db.collection('advertisers').doc(state.loggedInPartner.id).update({
                    requiresPasswordChange: false,
                    ownerUid: user.uid // Securely link this partner doc to the auth user
                });
                
                state.loggedInPartner.requiresPasswordChange = false;
                passwordChangeModal.classList.add('hidden');
                showToast('Password updated successfully!');
                showPage('partner-dashboard');

            } catch (error) {
                showToast(`Error: ${error.message}`, true);
            }
        }

                            </div>
                            <div>
                                <label for="description" class="block text-sm font-medium text-slate-700">Description</label>
                                <textarea name="description" rows="3" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm">${partner.description}</textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700">Current Logo</label>
                                <img src="${partner.logoUrl}" class="w-16 h-16 rounded-full object-cover mt-1">
                                <label for="newLogoUpload" class="block text-sm font-medium text-slate-700 mt-2">Upload New Logo (Optional)</label>
                                <input type="file" id="newLogoUpload" accept="image/*" class="mt-1 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-brand-blue hover:file:bg-blue-100">
                                <input type="hidden" name="logoUrl" value="${partner.logoUrl}">
                                <div id="settings-upload-status" class="text-xs text-slate-500 mt-2"></div>
                            </div>
                        </div>
                        <div class="mt-6 flex justify-end">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderPartnerProductsList(partnerId) {
            const listContainer = document.getElementById('partner-products-list');
            if (!listContainer) return;
            const partnerProducts = state.allProducts.filter(p => p.advertiserId === partnerId);

            if (partnerProducts.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-500 text-center py-4">You haven't added any products yet.</p>`;
                return;
            }

            listContainer.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-50">
                            <tr>
                                <th class="px-6 py-3">Product</th>
                                <th class="px-6 py-3">Price</th>
                                <th class="px-6 py-3">Sponsored</th>
                                <th class="px-6 py-3"></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${partnerProducts.map(p => `
                                <tr class="bg-white border-b">
                                    <td class="px-6 py-4 font-medium text-slate-900">${p.name}</td>
                                    <td class="px-6 py-4">Ksh ${p.price.toLocaleString()}</td>
                                    <td class="px-6 py-4">${p.isSponsored ? 'Yes' : 'No'}</td>
                                    <td class="px-6 py-4 text-right">
                                        <button class="delete-product-btn font-medium text-red-600 hover:underline" data-product-id="${p.id}">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function handleAddPartnerProduct(event) {
            event.preventDefault();
            if(state.isUploading) { showToast('Please wait for image to upload.', true); return; }
            const imageUrl = document.getElementById('productImageUrl').value;
            if(!imageUrl) { showToast('Product image is required.', true); return; }
            
            const formData = new FormData(event.target);
            const newProduct = {
                name: formData.get('productName'),
                category: formData.get('productCategory'),
                price: parseFloat(formData.get('productPrice')),
                imageUrl: formData.get('productImageUrl'),
                description: formData.get('productDescription'),
                isSponsored: document.getElementById('isSponsored').checked, 
                advertiserId: state.loggedInPartner.id
            };
            
            try {
                await db.collection('products').add(newProduct);
                showToast('Product added successfully!');
                closeAddProductModal();
            } catch (error) {
                showToast(`Error: ${error.message}`, true);
            }
        }

        async function handleProductImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const statusDiv = document.getElementById('product-upload-status');
            const urlInput = document.getElementById('productImageUrl');
            statusDiv.textContent = 'Uploading...';
            state.isUploading = true;
            urlInput.value = '';
            const uploadedUrl = await uploadToImgBB(file);
            state.isUploading = false;
            if (uploadedUrl) {
                urlInput.value = uploadedUrl;
                statusDiv.textContent = '✔ Upload successful!';
            } else {
                statusDiv.textContent = 'Upload failed.';
            }
        }
        
        async function handleDeletePartnerProduct(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                 try {
                     await db.collection('products').doc(productId).delete();
                     showToast('Product deleted.');
                 } catch (error) {
                     showToast(`Error: ${error.message}`, true);
                 }
            }
        }
        
        async function handleUpdateShopSettings(event) {
            event.preventDefault();
            if(state.isUploading) { showToast('Please wait for logo to upload.', true); return; }
            const formData = new FormData(event.target);
            const partnerId = state.loggedInPartner.id;
            const updatedData = {
                shopName: formData.get('shopName'),
                contactPhone: formData.get('contactPhone'),
                location: formData.get('location'),
                websiteUrl: formData.get('websiteUrl'),
                description: formData.get('description'),
                logoUrl: formData.get('logoUrl'),
            };

            try {
                await db.collection('advertisers').doc(partnerId).update(updatedData);
                showToast('Settings saved successfully!');
                // Manually update local state to reflect changes instantly
                state.loggedInPartner = { ...state.loggedInPartner, ...updatedData };
                renderPartnerDashboard();
            } catch (error) {
                showToast(`Error: ${error.message}`, true);
            }
        }

        async function handleSettingsLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const statusDiv = document.getElementById('settings-upload-status');
            const urlInput = document.querySelector('#partner-settings-form [name="logoUrl"]');
            
            statusDiv.textContent = 'Uploading...';
            state.isUploading = true;
            const uploadedUrl = await uploadToImgBB(file);
            state.isUploading = false;

            if (uploadedUrl) {
                urlInput.value = uploadedUrl;
                statusDiv.textContent = '✔ New logo uploaded! Click "Save Changes" to apply.';
                const headerLogo = document.querySelector('#partner-dashboard-page img');
                if(headerLogo) headerLogo.src = uploadedUrl;

            } else {
                statusDiv.textContent = 'Upload failed.';
            }
        }

        // =================================================================================
        // UI LOGIC & EVENT HANDLING
        // =================================================================================

        function showPage(pageId) {
            state.currentPage = pageId;
            pageContainer.innerHTML = pageTemplates[pageId] || `<p>Page not found</p>`;

            // Attach event listeners for the new page content
            if (pageId === 'home') {
                renderHomepageBannerAd(); 
                renderFeaturedPartners(); 
            } else if (pageId === 'shop') { 
                const sponsoredProducts = state.allProducts.filter(p => p.advertiserId && p.isSponsored);
                renderProducts('product-grid', sponsoredProducts); 
            } else if (pageId === 'partners') { 
                renderPartnerDirectory(); 
            } else if (pageId === 'partner-form') {
                document.getElementById('partner-application-form').addEventListener('submit', handlePartnerSubmission);
                document.getElementById('logoUpload').addEventListener('change', handleLogoUpload);
            } else if (pageId === 'partner-login') {
                document.getElementById('partner-login-form').addEventListener('submit', handlePartnerLogin);
                document.getElementById('forgot-password-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    showPage('partner-forgot-password');
                });
            } else if (pageId === 'partner-forgot-password') {
                document.getElementById('partner-forgot-password-form').addEventListener('submit', handlePartnerPasswordReset);
                document.getElementById('back-to-login-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    showPage('partner-login');
                });
            } else if (pageId === 'partner-dashboard') {
                renderPartnerDashboard();
            }

            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageId);
            });
            window.scrollTo(0, 0);
        }

        function openProductModal(productId) {
            const product = state.allProducts.find(p => p.id === productId);
            if (!product) return;
            const advertiser = product.isSponsored ? state.allPartners.find(adv => adv.id === product.advertiserId && adv.status === 'approved' && adv.isActive) : null;
            const isEffectivelySponsored = product.isSponsored && advertiser;
            
            let actionButtonHtml = '';
            let sellerInfoHtml = '';

            if (isEffectivelySponsored) {
                 sellerInfoHtml = `
                    <div class="bg-yellow-100 text-yellow-800 text-sm font-semibold p-3 rounded-lg mb-4 text-center">
                        This is a sponsored listing from our partner.
                    </div>
                    <div class="border-t pt-4">
                        <p class="text-sm text-slate-500">Sold & Shipped By:</p>
                        <p class="font-bold text-lg">${advertiser.shopName}</p>
                        <p class="font-semibold text-slate-700">${advertiser.contactPhone}</p>
                    </div>`;
                if (advertiser.websiteUrl) {
                    actionButtonHtml = `<a href="${advertiser.websiteUrl}" target="_blank" class="block w-full text-center btn btn-primary bg-green-500 hover:bg-green-600">View on Partner's Site</a>`;
                } else {
                     actionButtonHtml = `<a href="tel:${advertiser.contactPhone}" class="block w-full text-center btn btn-primary bg-green-500 hover:bg-green-600">Call to Order</a>`;
                }
            } else {
                 sellerInfoHtml = `
                    <div class="border-t pt-4">
                        <p class="text-sm text-slate-500">Sold & Shipped By:</p>
                        <p class="font-bold text-lg">Bwire Aesthetic Shop</p>
                    </div>`;
            }
            
            productModalContent.innerHTML = `
                <div class="w-full md:w-1/2">
                    <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover rounded-l-lg">
                </div>
                <div class="w-full md:w-1/2 p-8 flex flex-col">
                    <div class="flex-grow">
                        <p class="text-sm font-semibold text-brand-blue">${product.category}</p>
                        <h2 class="text-3xl font-bold mt-1 mb-3">${product.name}</h2>
                        <p class="text-slate-600 mb-6">${product.description}</p>
                        <p class="text-4xl font-bold text-slate-900">${'Ksh ' + product.price.toLocaleString()}</p>
                        <div class="mt-4">${sellerInfoHtml}</div>
                    </div>
                    <div class="mt-6 space-y-2">
                        <button class="add-to-cart-btn w-full btn btn-primary" data-product-id="${product.id}">Add to Cart</button>
                        ${actionButtonHtml}
                        <button class="w-full btn btn-secondary close-modal-btn">Close</button>
                    </div>
                </div>
            `;

            productModal.classList.remove('hidden');
            setTimeout(() => { productModalContent.classList.remove('scale-95', 'opacity-0'); }, 10);
        }
        function closeProductModal() {
            productModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { productModal.classList.add('hidden'); }, 300);
        }

        function openCartModal() {
            updateCartUI();
            cartModal.classList.remove('hidden');
            setTimeout(() => { cartPanel.classList.remove('translate-x-full'); }, 10);
        }

        function closeCartModal() {
            cartPanel.classList.add('translate-x-full');
            setTimeout(() => { cartModal.classList.add('hidden'); }, 300);
        }
        
        async function handleLogoUpload(event) {
             const file = event.target.files[0];
            if (!file) return;
            
            // --- ADDED: Logo Preview Logic ---
            const preview = document.getElementById('logoPreview');
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
            }
            reader.readAsDataURL(file);
            // --- END: Logo Preview Logic ---

            const uploadStatus = document.getElementById('upload-status');
            const logoUrlInput = document.getElementById('logoUrl');
            
            uploadStatus.textContent = 'Uploading...';
            state.isUploading = true;
            logoUrlInput.value = '';
            const uploadedUrl = await uploadToImgBB(file);
            state.isUploading = false;

            if (uploadedUrl) {
                logoUrlInput.value = uploadedUrl;
                uploadStatus.textContent = '✔ Upload successful!';
                uploadStatus.classList.remove('text-red-600');
                uploadStatus.classList.add('text-green-600');
            } else {
                uploadStatus.textContent = 'Upload failed. Please try again.';
                uploadStatus.classList.remove('text-green-600');
                uploadStatus.classList.add('text-red-600');
            }
        }

        async function handlePartnerSubmission(event) {
            event.preventDefault();
            if (state.isUploading) { showToast('Please wait for the logo to finish uploading.', true); return; }
            const logoUrl = document.getElementById('logoUrl').value;
            if (!logoUrl) { showToast('Logo upload is required.', true); return; }
            
            const formData = new FormData(event.target);
            const newSubmission = {
                shopName: formData.get('shopName'), description: formData.get('description'), logoUrl: formData.get('logoUrl'), websiteUrl: formData.get('websiteUrl'), contactPhone: formData.get('contactPhone'), location: formData.get('location'),
                email: formData.get('contactEmail'),
                status: 'pending', // Awaits admin approval
                isActive: false, // Must be enabled by admin
                requiresPasswordChange: true, // For when admin creates their account
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                await db.collection('advertisers').add(newSubmission);
                document.getElementById('partner-application-form').classList.add('hidden');
                document.getElementById('form-success-message').classList.remove('hidden');
            } catch (error) {
                showToast(`Error: ${error.message}`, true);
            }
        }
        
        function openAddProductModal() {
            addProductModal.classList.remove('hidden');
        }
        function closeAddProductModal() {
            addProductModal.classList.add('hidden');
            document.getElementById('add-product-form').reset();
            document.getElementById('product-upload-status').textContent = '';
        }

        // --- Main Event Listeners ---
        document.body.addEventListener('click', (e) => {
            // Main navigation & page changes
            if (e.target.closest('.nav-link')) {
                e.preventDefault();
                showPage(e.target.closest('.nav-link').dataset.page);
                document.getElementById('mobile-menu').classList.add('hidden');
            }
            // Product clicks (view details, add to cart, delete)
            if (e.target.closest('[data-product-id]')) {
                 const btn = e.target.closest('[data-product-id]');
                 if (btn.classList.contains('add-to-cart-btn')) { addToCart(btn.dataset.productId); } 
                 else if (btn.classList.contains('delete-product-btn')) { handleDeletePartnerProduct(btn.dataset.productId); }
                 else { openProductModal(btn.dataset.productId); }
            }
            // Modals and cart
            if (e.target.closest('.close-modal-btn') || e.target === productModal) { closeProductModal(); }
            if (e.target.closest('#mobile-menu-button')) { document.getElementById('mobile-menu').classList.toggle('hidden'); }
            if (e.target.closest('.visit-shop-btn')) { renderPartnerShopPage(e.target.closest('.visit-shop-btn').dataset.partnerId); }
            if (e.target.closest('#cart-button')) { openCartModal(); }
            if (e.target.closest('.close-cart-btn') || e.target === cartModal) { closeCartModal(); }
            if (e.target.closest('.remove-from-cart-btn')) { removeFromCart(e.target.closest('.remove-from-cart-btn').dataset.productId); }
            if (e.target.closest('#checkout-button')) { handleWhatsAppCheckout(); }

            // Partner Dashboard specific buttons
            if (state.currentPage === 'partner-dashboard') {
                if (e.target.closest('#partner-logout-btn')) handlePartnerLogout();
                if (e.target.closest('#add-product-btn')) openAddProductModal();
                if (e.target.closest('.dashboard-tab')) renderDashboardView(e.target.dataset.view);

                // Attach listeners only if the view is active
                if(state.dashboardView === 'settings') {
                    const settingsForm = document.getElementById('partner-settings-form');
                    const logoUpload = document.getElementById('newLogoUpload');
                    if (settingsForm) settingsForm.addEventListener('submit', handleUpdateShopSettings, { once: true });
                    if (logoUpload) logoUpload.addEventListener('change', handleSettingsLogoUpload, { once: true });
                }
            }
            if (e.target.closest('#close-add-product-modal-btn')) closeAddProductModal();
        });
        
        document.body.addEventListener('change', e => {
            if (e.target.classList.contains('quantity-input')) {
                updateCartItemQuantity(e.target.dataset.productId, parseInt(e.target.value, 10));
            }
        });

        document.getElementById('password-change-form').addEventListener('submit', handlePasswordChange);
        document.getElementById('add-product-form').addEventListener('submit', handleAddPartnerProduct);
        document.getElementById('productImageUpload').addEventListener('change', handleProductImageUpload);


        // =================================================================================
        // FIREBASE LISTENERS & INITIALIZATION
        // =================================================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const partnerQuery = await db.collection('advertisers').where('ownerUid', '==', user.uid).limit(1).get();
                if (!partnerQuery.empty) {
                    const partnerDoc = partnerQuery.docs[0];
                    state.loggedInPartner = { id: partnerDoc.id, ...partnerDoc.data() };
                } else {
                    // This handles the case for first-time password changers
                    // They aren't fully linked yet, so we don't sign them out immediately
                    if (!passwordChangeModal.classList.contains('hidden')) {
                         return;
                    }
                    auth.signOut();
                }
            } else {
                state.loggedInPartner = null;
                if (state.currentPage.startsWith('partner-')) {
                    showPage('home');
                }
            }
            updatePartnerAuthUI();
        });

        function initializeApp() {
            showPage('home');
            // Listen for real-time updates from Firestore
            db.collection('products').onSnapshot(snapshot => {
                state.allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Re-render current view if it depends on products
                if (['shop', 'partner-shop'].includes(state.currentPage)) showPage(state.currentPage);
                if (state.currentPage === 'partner-dashboard' && state.dashboardView === 'products') renderPartnerProductsList(state.loggedInPartner.id);
            });
            db.collection('advertisers').onSnapshot(snapshot => {
                state.allPartners = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                 if (state.loggedInPartner) {
                     const updatedPartnerData = state.allPartners.find(p => p.id === state.loggedInPartner.id);
                     if(updatedPartnerData) state.loggedInPartner = updatedPartnerData;
                 }
                if (['partners', 'home'].includes(state.currentPage)) showPage(state.currentPage);
            });
        }

        initializeApp();
    });
    </script>
</body>
</html>
